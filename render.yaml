# One-click backend deploy on Render (https://render.com) -> New > Blueprint
services:
  - type: web
    name: brandcanon-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: EMBED_MODEL
        value: gemini-embedding-001
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
